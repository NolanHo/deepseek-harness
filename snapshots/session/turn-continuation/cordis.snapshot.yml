# Replay patch for the turn-continuation scenario. A non-default composition does
# not inherit the default composition's replay layer, so this patch supplies both
# the replay adapter and the opt-in plugin row.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: plugin-package-inventory-deepseek
  name: '@deepseek-ai/dsh-plugin-package-inventory-deepseek'
  disabled: true

- id: session-title-llm
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash

    - id: turn-continuation
      name: ../../../packages/guard/turn-continuation/src/index.ts
      config:
        continueOn: [max-tokens]
        maxConsecutive: 2
